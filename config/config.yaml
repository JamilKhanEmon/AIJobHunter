app:
  name: AI Job Hunter
  version: 1.0.0
  env: development
  port: 8000
  host: 0.0.0.0
search_preferences:
  positions:
  - Full Stack AI and Automation Engineer
  - AI Engineer
  - Full Stack AI Developer
  - Machine Learning Engineer
  locations:
  - Dhaka, Bangladesh
  - Remote
  - Worldwide
  remote_only: false
  workplace_types:
  - remote
  - on_site
  - hybrid
  experience_levels:
  - mid_level
  - senior
  job_types:
  - full_time
  - contract
  date_posted: past_week
  max_age_days: 5
candidate_mobility:
  home_country: Bangladesh
  home_city: Dhaka
  accept_remote_worldwide: true
  accept_home_country_onsite: true
  accept_foreign_onsite_with_visa: true
  reject_foreign_onsite_without_visa: true
evaluation:
  min_match_score: 70
  auto_apply_score_threshold: 85
  strict_dealbreaker_check: true
  dealbreakers:
  - Foreign on-site role without visa sponsorship or relocation assistance
  - Requires foreign local work authorization or citizenship without offering visa
    sponsorship
  - Requires domestic security clearance restricted to foreign citizens
  - Unpaid internship or equity-only compensation
  company_blacklist:
  - Revature
  - Crossover
  title_blacklist:
  - Intern
  - Unpaid
  - Volunteer
ats_targets:
  greenhouse:
  - stripe
  - figma
  - anthropic
  - scaleai
  - discord
  - airbnb
  - databricks
  - supabase
  - vercel
  - linear
  - cloudflare
  - notion
  - grafana
  - postman
  - mongodb
  - elastic
  - gitlab
  - canonical
  - coinbase
  - kraken
  lever:
  - palantir
  - spotify
  - netflix
  - lyft
  - modern-treasury
  - clearbit
  - plaid
  - coursera
  - automattic
  ashby:
  - retool
  - openai
  - ramp
  - cursor
  - perplexity
  - mistral
  - replicate
  - together
  - vllm
  - modal
ai_router:
  active_provider: groq
  model_name: openai/gpt-oss-20b
  groq_base_url: https://api.groq.com/openai/v1
  ollama_base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 4096
  fallback_to_mock: false
automation:
  headless: false
  slow_mo_ms: 120
  max_daily_applications: 25
  cooldown_between_apps_seconds: 45
  user_data_dir: data/chrome_profile
  anti_detection: true
  screenshot_on_error: true
